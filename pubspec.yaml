name: opencompass
description: "Compass app"
publish_to: 'none'

version: 1.4.1+9

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_compass: ^0.8.0
  url_launcher: ^6.2.5
  sensors_plus: ^6.1.1
  geolocator: ^13.0.1
  intl: ^0.19.0
  camera: ^0.11.0
  magnetic_declination: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
     - assets/images/
